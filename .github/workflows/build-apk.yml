name: Build IKYY Live Notes APK

on:
workflow_dispatch:
push:
branches: [main, master]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Ambil kode proyek
uses: actions/checkout@v4

  - name: Siapkan Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Berikan izin Gradle
    run: chmod +x gradlew || true

  - name: Bangun APK
    run: |
      if [ -f gradlew ]; then
        ./gradlew assembleDebug
      else
        echo "File gradlew belum ada. Proyek Android belum lengkap."
        exit 1
      fi

  - name: Simpan APK
    uses: actions/upload-artifact@v4
    with:
      name: IKYY-Live-Notes-APK
      path: app/build/outputs/apk/debug/*.apk
