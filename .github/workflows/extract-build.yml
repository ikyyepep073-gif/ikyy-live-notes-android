name: Extract ZIP and Build APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Ambil repositori
    uses: actions/checkout@v4

  - name: Siapkan Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Ekstrak ZIP proyek
    run: |
      mkdir -p extracted
      ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
      if [ -z "$ZIP" ]; then
        echo "File ZIP tidak ditemukan"
        exit 1
      fi
      unzip -o "$ZIP" -d extracted
      echo "Isi ZIP:"
      find extracted -maxdepth 4 -type f | head -100

  - name: Cari proyek Android
    run: |
      GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
      if [ -n "$GRADLEW" ]; then
        echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
      elif find extracted -type f -name build.gradle -o -name build.gradle.kts | grep -q .; then
        echo "File gradlew tidak ada. Proyek perlu diperiksa."
        exit 1
      else
        echo "Proyek Android tidak ditemukan dalam ZIP."
        exit 1
      fi

  - name: Bangun APK
    run: |
      cd "$PROJECT_DIR"
      gradle assembleDebug

  - name: Simpan APK
    uses: actions/upload-artifact@v4
    with:
      name: IKYY-Live-Notes-APK
      path: extracted/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
